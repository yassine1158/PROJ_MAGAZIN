{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · {{ NOM_AFFICHE }}</title>
  <link rel="stylesheet" href="{% static 'stock/app.css' %}">
  <link rel="icon" href="{% static 'stock/produit-icone.svg' %}">
  <style>:root { --primaire: {{ COULEURS.primaire }}; --primaire-fonce: {{ COULEURS.fonce }}; --primaire-clair: {{ COULEURS.clair }}; }</style>
</head>
<body>
  <main class="page-connexion">
    <form method="post" class="carte boite-connexion">
      {% csrf_token %}
      <img src="{{ LOGO_URL }}" alt="{{ NOM_AFFICHE }}">
      <h1>{% if SOCIETE %}{{ SOCIETE }}{% else %}Gestion du magasin{% endif %}</h1>
      <p class="sous">Connectez-vous pour continuer</p>
      {% if form.errors %}
        <div class="message message-error">Nom d'utilisateur ou mot de passe incorrect.</div>
      {% endif %}
      <div class="champ">
        <label for="id_username">Nom d'utilisateur</label>
        <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
      </div>
      <div class="champ">
        <label for="id_password">Mot de passe</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-vert btn-grand">Se connecter</button>
      <p class="produit-bas">{{ PRODUIT }} · gestion de magasin</p>
    </form>
  </main>
</body>
</html>
